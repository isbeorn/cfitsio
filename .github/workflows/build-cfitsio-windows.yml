name: build-cfitsio-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Create vcpkg manifest + configuration (baseline = vcpkg submodule HEAD)
      - name: Generate vcpkg manifest & config
        shell: pwsh
        run: |
          $baseline = (git -C vcpkg rev-parse HEAD).Trim()

          $manifestObj = [ordered]@{
            name = "cfitsio-build"
            "version-string" = "1.0.0"
            dependencies = @("zlib","pthreads")
            "builtin-baseline" = $baseline
          }
          $manifestJson = $manifestObj | ConvertTo-Json -Depth 3
          Set-Content -Path vcpkg.json -Value $manifestJson -Encoding utf8

          $configObj = [ordered]@{
            "default-registry" = @{
              kind = "builtin"
              baseline = $baseline
            }
          }
          $configJson = $configObj | ConvertTo-Json -Depth 3
          Set-Content -Path vcpkg-configuration.json -Value $configJson -Encoding utf8


      - name: Run vcpkg (manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Put vcpkg installed dir outside repo/build (avoids export-path issues)
        shell: pwsh
        run: echo "VCPKG_INSTALLED_DIR=$env:RUNNER_TEMP\vcpkg_installed" >> $env:GITHUB_ENV

      # Remove F77 wrappers (avoids cfortran.h environment error on MSVC)
      - name: Remove Fortran 77 wrappers on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Join-Path $PWD "CMakeLists.txt"
          (Get-Content $p) |
            Where-Object { $_ -notmatch 'f77_wrap[1-4]\.c' } |
            Set-Content $p

      - name: Configure (CMake -> VS 2022)
        shell: pwsh
        run: >
          cmake -S . -B build\cfitsio
          -G "Visual Studio 17 2022" -A x64
          -DBUILD_SHARED_LIBS=ON
          -DUSE_SSE2=ON
          -DUSE_SSSE3=ON
          -DUSE_CURL=OFF
          -DUSE_PTHREADS=ON
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}"
          -DCMAKE_THREAD_PREFER_PTHREAD=ON
          -DTHREADS_PREFER_PTHREAD_FLAG=ON
          -DPThreads4W_DIR="${env:VCPKG_INSTALLED_DIR}\x64-windows\share\PThreads4W"
          -DCMAKE_C_FLAGS="/Dstrtok_r=strtok_s"


      - name: Build
        run: cmake --build build\cfitsio --config Release -j 2

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build\cfitsio\*.dll artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.lib artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.pdb artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts\include | Out-Null
          Copy-Item -Recurse external\cfitsio\*.h artifacts\include\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfitsio-windows-x64
          path: artifacts
          if-no-files-found: error
