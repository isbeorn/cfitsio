name: build-cfitsio-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ runner.tool_cache }}\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-win-${{ runner.os }}-${{ hashFiles('**/vcpkg*.json') }}
          restore-keys: vcpkg-win-${{ runner.os }}-

      - name: Bootstrap vcpkg (if cache miss)
        if: ${{ !exists(env.VCPKG_ROOT) }}
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & $env:VCPKG_ROOT\bootstrap-vcpkg.bat

      - name: Install deps with vcpkg
        run: |
          $triplet="x64-windows"
          & $env:VCPKG_ROOT\vcpkg.exe install zlib:$triplet pthreads:$triplet

      - name: Configure (CMake)
        run: >
          cmake -S external/cfitsio -B build\cfitsio
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DUSE_SSE2=ON
          -DUSE_SSSE3=ON
          -DUSE_CURL=OFF
          -DUSE_PTHREADS=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build\cfitsio --config Release -j 2

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Typical Ninja/VS layout from CFITSIO's CMake:
          Copy-Item -Recurse build\cfitsio\*.dll artifacts -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\cfitsio\*.lib artifacts -ErrorAction SilentlyContinue
          Copy-Item -Recurse build\cfitsio\*.pdb artifacts -ErrorAction SilentlyContinue
          # Headers (so downstreams can consume the artifact easily)
          Copy-Item -Recurse external\cfitsio\*.h artifacts\include\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfitsio-windows-x64
          path: artifacts
          if-no-files-found: error
