name: build-cfitsio-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Use vcpkg manifest mode (needs vcpkg.json at repo root)
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json' 

      - name: Configure (CMake -> Ninja, force MSVC, keep vcpkg outside src/build)
        env:
          # Put vcpkg_installed not under the source or build dirs:
          VCPKG_INSTALLED_DIR: ${{ runner.temp }}\vcpkg_installed
        run: >
          cmake -S . -B build\cfitsio
          -G "Ninja"
          -DCMAKE_C_COMPILER=cl.exe
          -DCMAKE_CXX_COMPILER=cl.exe
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DUSE_SSE2=ON
          -DUSE_SSSE3=ON
          -DUSE_CURL=OFF
          -DUSE_PTHREADS=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR="${{ env.VCPKG_INSTALLED_DIR }}"

      - name: Build
        run: cmake --build build\cfitsio --config Release -j 2

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build\cfitsio\*.dll artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.lib artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.pdb artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts\include | Out-Null
          Copy-Item -Recurse external\cfitsio\*.h artifacts\include\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfitsio-windows-x64
          path: artifacts
          if-no-files-found: error
