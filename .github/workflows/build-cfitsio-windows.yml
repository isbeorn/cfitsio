name: build-cfitsio-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (incl. submodules if used)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- vcpkg: reads your vcpkg.json, pins via builtin-baseline, installs & caches deps ---
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'   # expects a vcpkg.json in repo (see note below)
          # you can add extraArgs: --clean-after-build if you want smaller cache size

      # --- Configure with CMake (Ninja single-config keeps outputs in one folder) ---
      - name: Configure (CMake -> Ninja)
        run: >
          cmake -S external/cfitsio -B build\cfitsio
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DUSE_SSE2=ON
          -DUSE_SSSE3=ON
          -DUSE_CURL=OFF
          -DUSE_PTHREADS=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build\cfitsio --config Release -j 2

      # --- Collect DLL + import lib + PDB + headers ---
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build\cfitsio\*.dll artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.lib artifacts -ErrorAction SilentlyContinue
          Copy-Item build\cfitsio\*.pdb artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts\include | Out-Null
          Copy-Item -Recurse external\cfitsio\*.h artifacts\include\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfitsio-windows-x64
          path: artifacts
          if-no-files-found: error
